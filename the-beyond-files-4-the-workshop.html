eave a hat wherever I would like to be remembered. It is a cheap, durable vanity.')]}])}\n/* ---- 15: The Quiet Helper (Odile) ---- */\nconst YEARS=newLevel('years',20,86,{fog:[0x120e1a,12,56],hemi:[0xe8dcc8,0x2a2030,1.0],spawn:{x:0,z:38,yaw:0},floorMat:mat('carpetY',0xffffff,TX.carpet),h:6});\nYEARS.s={n:0,got:[false,false,false,false,false]};\n{const g=YEARS.g;bounds(YEARS,mc(0x3a2f48));\n const ages=[['Age 9','The dark after the Lathe night. A small girl under a desk, holding a dead lantern. A gray figure, patient and quiet, sits on the floor a few feet away and says nothing at all. After a long time the girl scoots a little closer.'],['Age 11','The Institute has gone quiet. The girl has learned the sound of each searcher. A gray lady brings her a blanket the color of the dark so she is not afraid of it.'],['Age 16','She is learning to sit with others now. A new frightened child under a table; Odile folds herself onto the floor, a few feet away, and waits.'],['Age 17','A night nurse leaves a light on in the hall. Odile does not need the light, but she is grateful it was left. She notices the hat on the nurses\u2019 station peg and does not ask.'],['Very old','Odile is very old and very small, and she is still sitting on the floor of the building at 3 a.m. beside whichever child has come in afraid. This is, she thinks, the whole of the job: not to rescue, but to be there until they do.']];\n ages.forEach((a,i)=>{const z=30-i*16;lampAt(YEARS,0,3.8,z,[0xffe2a0,0xe8d0ff,0xcfe0ff,0xffd0a0,0xfff0d0][i],.9,14);solid(YEARS,-6,z,3,1.4,.8,mc(0x4a3a30));const ch=new THREE.Group();box(ch,.5,.8,.4,0,.4,0,mc(0x8f95a0,0x15181c));box(ch,.34,.34,.34,0,1.0,0,mc(0xd9c3ad,0x1d1814));ch.position.set(-6,0,z+2);g.add(ch);\n  box(g,.8,.14,.8,2.5,.07,z,mc(0x666a74));\n  inter(YEARS,2.5,z,'sit with her ('+a[0]+')',()=>{YEARS.s.got[i]=true;YEARS.s.n++;P.still=true;card(a[0],['~'+a[1]],[['Stay a little longer',()=>{resume();sub(YEARS.s.n>=5?'You have sat with all five. Walk to the end of th
